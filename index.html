<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEJM Quest · Agoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@500;700&display=swap">
<style>:root{
  /* Agoria la nuit : signalétique de métro posée sur une ville néon isométrique */
  --night:#060914; --asphalt:#0D1328; --panel:#111934; --panel2:#18224A; --rule:#283463;
  --paper:#EEF1F8; --fog:#939CBA; --sodium:#FFB547; --cartel:#FF3355; --ok:#45E09A;
  --f-display:'Big Shoulders','Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'Overpass',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Overpass Mono',ui-monospace,Menlo,monospace;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--night);color:var(--paper);font-family:var(--f-body);font-size:16px;line-height:1.45}
body{overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--sodium);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
.ico{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.18em}
.ico.fill{fill:currentColor;stroke:none}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-display);font-weight:800;letter-spacing:.01em}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fog)}

/* ---------- Carte ---------- */
#stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 70% at 50% -10%,#16204A 0%,#0A0F25 45%,var(--night) 75%);touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:1760px;height:1080px;transform-origin:0 0;will-change:transform}
#world svg{display:block;width:1760px;height:1080px;overflow:visible}
.b .wl,.b .wr{pointer-events:none}
.b .ft{stroke-linejoin:round}
.hit{cursor:pointer}
.hit:hover .plaza{fill-opacity:1}
.plaza{transition:stroke .4s,fill .4s}
.lab rect{transition:stroke .3s}
.hit:hover .lab rect,.hit:focus .lab rect{stroke:var(--sodium)}
.metro{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.28;stroke-dasharray:2 10}
.metro.part{opacity:.55;stroke-dasharray:14 10}
.metro.on{opacity:1;stroke-dasharray:22 12;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-34}}
.twk{animation:twk 3.4s ease-in-out infinite}
@keyframes twk{50%{opacity:.62}}
.glitch{animation:glitch 2.6s steps(2) infinite}
@keyframes glitch{0%,86%{opacity:.5}88%{opacity:.95}90%{opacity:.2}93%{opacity:.85}96%{opacity:.4}}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.35);opacity:.55}}
.beam{animation:beam 6s ease-in-out infinite;transform-box:view-box}
@keyframes beam{0%,100%{opacity:.18}50%{opacity:.5}}
.sweep{animation:sweep 7s ease-in-out infinite;transform-origin:160px 790px}
@keyframes sweep{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(24deg)}}
.lightup{animation:lightup 1.2s ease-out both}
@keyframes lightup{0%{filter:brightness(3)}100%{filter:none}}
.blink{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud>*{pointer-events:auto}
.card{background:rgba(13,19,40,.86);border:1px solid var(--rule);border-radius:var(--r);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.hud-player{position:absolute;left:14px;top:14px;display:flex;gap:12px;align-items:center;padding:8px 14px 8px 8px;min-width:230px;border:1px solid var(--rule)}
.hud-player .who{flex:1;min-width:0}
.hud-player .nm{font-family:var(--f-display);font-weight:800;font-size:1.25rem;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{font-family:var(--f-mono);font-size:.68rem;color:var(--sodium);letter-spacing:.08em}
.bar{height:6px;border-radius:6px;background:#202A52;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--sodium),#FFD58C);border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xpt{font-family:var(--f-mono);font-size:.66rem;color:var(--fog);margin-top:3px}
.hud-obj{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:9px 16px;max-width:min(560px,calc(100% - 560px));font-size:.88rem;border-color:#3A3420}
.hud-obj b{color:var(--sodium);font-family:var(--f-mono);font-size:.66rem;letter-spacing:.14em}
.hud-obj span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-right{position:absolute;right:14px;top:14px;display:flex;gap:10px;align-items:stretch}
.stat{display:flex;align-items:center;gap:8px;padding:8px 14px;font-family:var(--f-mono);font-size:.95rem;font-weight:700}
.stat .ico{color:var(--sodium)}
.city{display:flex;flex-direction:column;justify-content:center;padding:8px 14px;min-width:180px}
.city .row{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;color:var(--fog)}
.city .row b{color:var(--paper);font-size:.85rem}
.city .bar>i{background:linear-gradient(90deg,#3BA7FF,#9B7BFF,#FF8FB1)}
.saved{position:absolute;right:16px;top:74px;font-family:var(--f-mono);font-size:.66rem;color:var(--ok);padding:3px 9px;border-radius:20px;background:rgba(10,30,22,.75);border:1px solid #1E5A43}
.saved.local{color:var(--fog);border-color:var(--rule);background:rgba(13,19,40,.8)}
.hud-tools{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px}
.tbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(13,19,40,.88);border:1px solid var(--rule);color:var(--paper);font-size:1.1rem}
.tbtn:hover{border-color:var(--sodium);color:var(--sodium)}
.hud-phare{position:absolute;left:14px;bottom:14px;display:flex;gap:10px;align-items:center;padding:8px 14px 8px 8px;cursor:pointer;border-color:#4A3A1A}
.hud-phare .ttl{font-family:var(--f-display);font-weight:800;font-size:1.05rem;line-height:1}
.hud-phare small{display:block;color:var(--fog);font-size:.74rem}
.hint-bar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:.78rem;color:var(--fog);padding:6px 14px;border-radius:30px;white-space:nowrap}
.legend{position:absolute;left:50%;top:62px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;pointer-events:auto}

/* ---------- Panneau quartier ---------- */
.panel{position:fixed;z-index:12;top:96px;right:14px;width:min(400px,calc(100% - 28px));max-height:calc(100% - 170px);overflow:auto;padding:20px;transform:translateX(calc(100% + 30px));transition:transform .45s cubic-bezier(.2,.8,.2,1);border-top:4px solid var(--k,var(--sodium))}
.panel.open{transform:none}
.panel .x{position:absolute;right:10px;top:10px}
.linebadge{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;color:var(--k);font-weight:700}
.linebadge i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--k);color:#071022;font-style:normal;font-family:var(--f-display);font-size:1rem;font-weight:900}
.panel h2{font-family:var(--f-display);font-weight:900;font-size:2.6rem;line-height:.95;margin:10px 0 4px;text-transform:uppercase}
.panel .theme{color:var(--fog);font-size:.88rem;margin-bottom:12px}
.npc{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--panel2);margin:14px 0}
.npc svg{width:56px;height:56px;flex:none}
.npc b{display:block;font-family:var(--f-display);font-size:1.1rem}
.npc small{color:var(--fog);font-size:.74rem}
.npc p{font-size:.9rem;margin-top:6px;font-style:italic}
.prog{display:flex;gap:4px;margin:8px 0 2px}
.prog i{flex:1;height:6px;border-radius:4px;background:#232D57}
.prog i.on{background:var(--k)}
.stations{list-style:none;margin:12px 0 16px;padding:0;display:grid;gap:6px}
.stations li{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--fog)}
.stations li.done{color:var(--paper)}
.stations .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--k);flex:none}
.stations li.done .dot{background:var(--k)}
.stars{color:var(--sodium);font-size:.8rem;letter-spacing:1px;margin-left:auto;white-space:nowrap}
.stars .off{color:#3A456F}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;border:0;background:var(--sodium);color:#1B1200;font-weight:800;font-size:.98rem;text-decoration:none;transition:transform .12s,filter .2s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.38;cursor:not-allowed;filter:none}
.btn.k{background:var(--k);color:#071022}
.btn.ghost{background:transparent;color:var(--paper);border:1px solid var(--rule)}
.btn.ghost:hover{border-color:var(--fog)}
.btn.small{padding:8px 13px;font-size:.85rem;border-radius:10px}
.btn.wide{width:100%}
.btn.danger{background:var(--cartel);color:#fff}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--rule);background:transparent;display:grid;place-items:center;color:var(--fog)}
.iconbtn:hover{color:var(--paper);border-color:var(--fog)}

/* ---------- Écrans plein cadre ---------- */
.screen{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(4,6,14,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.screen.open{display:flex;animation:fadein .25s ease-out}
@keyframes fadein{from{opacity:0}}
.sheet{position:relative;width:min(900px,100%);max-height:100%;overflow:auto;background:var(--asphalt);border:1px solid var(--rule);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(14px);opacity:.4}}
.sheet.narrow{width:min(560px,100%)}

/* ---------- Ligne de métro ---------- */
#line{background:radial-gradient(90% 80% at 50% 20%,#111A3A,#05070F);backdrop-filter:none;padding:0;align-items:stretch}
.linewrap{display:flex;flex-direction:column;width:100%;height:100%;padding:22px 26px}
.linehead{display:flex;align-items:flex-start;gap:16px;justify-content:space-between;flex-wrap:wrap}
.linehead h2{font-family:var(--f-display);font-weight:900;font-size:clamp(2rem,5vw,3.4rem);line-height:.9;text-transform:uppercase}
.linehead p{color:var(--fog);max-width:62ch;font-size:.92rem;margin-top:6px}
.linesvg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.linesvg svg{width:100%;height:100%;max-height:100%}
.st{cursor:pointer}
.st:focus{outline:none}
.st:focus .ring,.st:hover .ring{stroke:var(--sodium)}
.st.lock{cursor:not-allowed}
.st text{font-family:var(--f-body)}
.st .t1{font-family:var(--f-mono);font-size:13px;letter-spacing:.14em;fill:var(--fog)}
.st .t2{font-family:var(--f-display);font-weight:800;font-size:23px;fill:var(--paper)}
.st.lock .t2{fill:#5B6690}
.cur .ring{animation:ring 1.6s ease-in-out infinite}
@keyframes ring{50%{stroke-width:9}}
.linefoot{color:var(--fog);font-size:.8rem;text-align:center}

/* ---------- Briefing ---------- */
.brief{padding:26px}
.brief h3{font-family:var(--f-display);font-weight:900;font-size:2.2rem;line-height:.95;text-transform:uppercase;margin:8px 0 6px}
.brief .pq{font-size:.86rem;color:var(--fog);margin-bottom:12px}
.exlist{list-style:none;padding:0;margin:14px 0;display:grid;gap:6px;counter-reset:n}
.exlist li{display:flex;gap:10px;align-items:center;font-size:.9rem;padding:8px 10px;background:var(--panel);border-radius:10px}
.exlist li .tag{margin-left:auto}
.rewards{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:30px;background:var(--panel2);font-size:.78rem;font-family:var(--f-mono)}
.pill .ico{color:var(--sodium)}
.row-end{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.12em;padding:3px 8px;border-radius:20px;border:1px solid currentColor;white-space:nowrap}
.tag.eco{color:#FFC56E}.tag.droit{color:#C8B5FF}.tag.mgt{color:#74E8D6}.tag.meth{color:#B9C3E6}

/* ---------- Mission ---------- */
.mission{display:flex;flex-direction:column;max-height:calc(100vh - 36px);max-height:calc(100dvh - 36px)}
.mhead{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--rule)}
.mhead h3{font-family:var(--f-display);font-weight:900;font-size:1.6rem;line-height:1;text-transform:uppercase}
.mhead .grow{flex:1;min-width:0}
.enemy{display:flex;align-items:center;gap:12px;padding:10px 20px;background:linear-gradient(90deg,rgba(255,51,85,.12),transparent 70%);border-bottom:1px solid #3A1A2A}
.enemy svg{width:40px;height:40px;flex:none}
.enemy .say{font-family:var(--f-mono);font-size:.8rem;color:#FFB3C1;flex:1;min-width:0}
.enemy .nm{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.14em;color:var(--cartel)}
.hp{width:150px}
.hp .lbl{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.62rem;color:var(--fog)}
.hp .bar>i{background:linear-gradient(90deg,#FF3355,#FF7A8E)}
.steps{display:flex;gap:4px;padding:12px 20px 0}
.steps i{flex:1;height:5px;border-radius:3px;background:#232D57}
.steps i.done{background:var(--k)}
.steps i.now{background:var(--sodium)}
.mbody{flex:1;overflow:auto;padding:16px 20px 8px}
.exmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.q{font-size:1.12rem;font-weight:600;line-height:1.45;margin-bottom:14px;max-width:72ch}
.doc{border:1px solid var(--rule);border-left:3px solid var(--sodium);background:var(--panel);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:.92rem}
.doc b{display:block;font-size:.78rem;font-family:var(--f-mono);letter-spacing:.06em;color:var(--sodium);margin-bottom:4px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--rule);background:var(--panel);font-size:.97rem;line-height:1.4;transition:border-color .15s,background .15s}
.opt:hover{border-color:#4A5893}
.opt .key{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:#232D57;font-family:var(--f-mono);font-size:.78rem;font-weight:700}
.opt.sel{border-color:var(--sodium);background:#221D14}
.opt.sel .key{background:var(--sodium);color:#1B1200}
.opt.ok{border-color:var(--ok);background:#0E2A22}
.opt.ok .key{background:var(--ok);color:#06210F}
.opt.ko{border-color:var(--cartel);background:#2A0F18}
.opt.ko .key{background:var(--cartel);color:#fff}
.opt.miss{border-style:dashed;border-color:var(--ok)}
.locked .opt,.locked button.chipbtn,.locked .vfb{pointer-events:none}
.multi .opt .key{border-radius:5px}
.vf{display:grid;gap:8px}
.vfrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--rule)}
.vfrow.ok{border-color:var(--ok)}.vfrow.ko{border-color:var(--cartel)}
.vfrow .why{grid-column:1/-1;font-size:.84rem;color:#BFE9D6}
.vfb{display:flex;gap:6px}
.vfb button{padding:7px 12px;border-radius:9px;border:1px solid var(--rule);background:#1A2347;font-weight:700;font-size:.85rem}
.vfb button.sel{background:var(--sodium);color:#1B1200;border-color:var(--sodium)}
.match{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.mcol{display:grid;gap:8px;align-content:start}
.chipbtn{position:relative;text-align:left;padding:10px 12px 10px 38px;border-radius:12px;border:1px solid var(--rule);background:var(--panel);font-size:.9rem;line-height:1.35}
.chipbtn .n{position:absolute;left:8px;top:9px;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-mono);font-size:.72rem;font-weight:700;background:#232D57;color:var(--fog)}
.chipbtn.armed{border-color:var(--sodium);box-shadow:0 0 0 2px rgba(255,181,71,.25)}
.chipbtn.paired .n{color:#071022}
.chipbtn.ok{border-color:var(--ok)}.chipbtn.ko{border-color:var(--cartel)}
.ordr{display:grid;gap:12px}
.seq,.pool{display:grid;gap:7px;min-height:44px;padding:10px;border-radius:12px;border:1px dashed var(--rule)}
.seq{border-style:solid;background:#0B1124}
.seq:empty::before{content:'Clique sur les étapes dans l’ordre…';color:var(--fog);font-size:.85rem}
.calc{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.calc input{width:200px;padding:12px 14px;border-radius:12px;border:1px solid var(--rule);background:#0B1124;color:var(--paper);font-family:var(--f-mono);font-size:1.25rem}
.calc .u{font-family:var(--f-mono);font-size:1.1rem;color:var(--fog)}
.calc input.ok{border-color:var(--ok)}.calc input.ko{border-color:var(--cartel)}
.fm{margin-top:10px;font-size:.85rem;color:var(--fog);font-family:var(--f-mono)}
.trou{font-size:1.05rem;line-height:2.4}
.trou select{font:inherit;font-weight:700;padding:4px 8px;border-radius:9px;border:1px solid var(--sodium);background:#221D14;color:var(--paper);max-width:100%}
.trou select.ok{border-color:var(--ok);background:#0E2A22}.trou select.ko{border-color:var(--cartel);background:#2A0F18}
.ctx{border:1px solid var(--rule);background:var(--panel);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:.95rem}
.cstep{border-left:3px solid #2C3768;padding:4px 0 6px 14px;margin-bottom:12px}
.cstep.done{border-color:var(--ok)}
.cstep .lb{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;color:var(--sodium);text-transform:uppercase}
.cstep.done .lb{color:var(--ok)}
.cstep .ans{font-size:.92rem;margin-top:4px}
.cstep .why{font-size:.84rem;color:var(--fog);margin-top:4px}
textarea{width:100%;min-height:170px;padding:12px 14px;border-radius:12px;border:1px solid var(--rule);background:#0B1124;color:var(--paper);font:inherit;font-size:.97rem;line-height:1.55;resize:vertical}
.wc{font-family:var(--f-mono);font-size:.78rem;color:var(--fog);margin-top:6px}
.wc.okc{color:var(--ok)}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.kw span{font-size:.78rem;padding:3px 9px;border-radius:20px;border:1px solid var(--rule);color:var(--fog)}
.kw span.hit{border-color:var(--ok);color:var(--ok)}
.check{display:grid;gap:6px;margin:10px 0}
.check label{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--sodium)}
.model{border-left:3px solid var(--ok);background:#0D2219;border-radius:10px;padding:12px 14px;font-size:.93rem;margin-top:10px}
.fb{padding:0 20px}
.fbx{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;margin:6px 0 4px;font-size:.93rem;animation:rise .25s}
.fbx.ok{background:#0D2219;border:1px solid #1D5E45}
.fbx.ko{background:#2A0F18;border:1px solid #6A2236}
.fbx.info{background:#221D14;border:1px solid #5A4520}
.fbx .ico{margin-top:2px}
.fbx.ok .ico{color:var(--ok)}.fbx.ko .ico{color:var(--cartel)}.fbx.info .ico{color:var(--sodium)}
.corr h4{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ok);margin-bottom:4px}
.notions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.notions span{font-size:.72rem;padding:2px 8px;border-radius:20px;background:#13324F;color:#9FD3FF}
.mfoot{display:flex;gap:10px;align-items:center;padding:12px 20px 16px;border-top:1px solid var(--rule);flex-wrap:wrap}
.mfoot .grow{flex:1}
.kbd{font-family:var(--f-mono);font-size:.68rem;color:var(--fog)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.float{position:fixed;z-index:60;pointer-events:none;font-family:var(--f-display);font-weight:900;font-size:1.6rem;color:var(--sodium);animation:floatup 1.2s ease-out forwards;text-shadow:0 4px 18px rgba(0,0,0,.6)}
@keyframes floatup{to{transform:translateY(-60px);opacity:0}}

/* ---------- Boss ---------- */
.bosshead{display:flex;gap:16px;align-items:center;padding:18px 20px;background:linear-gradient(120deg,#2A0D1A,#120A1F 60%);border-bottom:1px solid #4A1A2E}
.bosshead svg{width:76px;height:76px;flex:none}
.bosshead h3{font-family:var(--f-display);font-weight:900;font-size:2rem;line-height:.95;text-transform:uppercase}
.bosshead .say{font-family:var(--f-mono);font-size:.82rem;color:#FFB3C1;margin-top:4px}
.bosshp{flex:1;min-width:0}
.bosshp .bar{height:12px}
.bosshp .bar>i{background:linear-gradient(90deg,#FF3355,#FF8FA1)}
.shields{display:flex;gap:4px;color:#7FD1FF;margin-top:6px}
.shields .off{color:#2A3358}
.hurt{animation:hurt .45s}
@keyframes hurt{30%{transform:translateX(-8px) rotate(-3deg);filter:brightness(2)}60%{transform:translateX(6px)}}

/* ---------- Résultats ---------- */
.result{padding:30px 26px;text-align:center}
.result h3{font-family:var(--f-display);font-weight:900;font-size:clamp(2.2rem,6vw,3.4rem);line-height:.92;text-transform:uppercase;margin:6px 0}
.bigstars{font-size:2.6rem;color:var(--sodium);letter-spacing:6px;margin:10px 0}
.bigstars .off{color:#2C3766}
.bigstars span{display:inline-block;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.bigstars span:nth-child(2){animation-delay:.15s}.bigstars span:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0)}}
.reslist{list-style:none;padding:0;margin:16px auto;max-width:520px;text-align:left;display:grid;gap:5px}
.reslist li{display:flex;gap:10px;align-items:center;font-size:.88rem;padding:7px 10px;border-radius:9px;background:var(--panel)}
.reslist .s{margin-left:auto;font-family:var(--f-mono);font-size:.72rem}
.good{color:var(--ok)}.bad{color:var(--cartel)}.meh{color:var(--sodium)}

/* ---------- Phare ---------- */
.phare{display:flex;flex-direction:column;height:min(760px,100%)}
.tabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tabs button{padding:12px 14px;border:0;background:none;color:var(--fog);font-weight:700;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--paper);border-color:var(--sodium)}
.tabbody{flex:1;overflow:auto;padding:18px 20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.badge{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--rule)}
.badge .ico{width:28px;height:28px;color:#3A456F}
.badge.on .ico{color:var(--sodium)}
.badge b{display:block;font-size:.92rem}
.badge small{color:var(--fog);font-size:.76rem}
.badge:not(.on){opacity:.6}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.kpi{padding:12px;border-radius:12px;background:var(--panel)}
.kpi b{display:block;font-family:var(--f-display);font-size:2rem;font-weight:900;line-height:1}
.kpi small{color:var(--fog);font-size:.76rem}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--rule);background:#0B1124;color:var(--paper);font:inherit}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.filters button{padding:5px 11px;border-radius:20px;border:1px solid var(--rule);background:none;color:var(--fog);font-size:.8rem}
.filters button.on{background:var(--paper);color:#0A0F25;border-color:var(--paper)}
.codex{display:grid;gap:6px}
.cx{padding:10px 12px;border-radius:10px;background:var(--panel);border-left:3px solid var(--k,#4A5893)}
.cx b{font-size:.95rem}
.cx p{font-size:.86rem;color:#C9D0E6;margin-top:2px}
.cx .m{float:right;font-family:var(--f-mono);font-size:.66rem;color:var(--ok)}
.fiche{padding:14px 16px;border-radius:12px;background:var(--panel);margin-bottom:10px}
.fiche h4{font-family:var(--f-display);font-size:1.35rem;font-weight:800}
.fiche ol{margin:8px 0 0;padding-left:20px;font-size:.9rem;display:grid;gap:4px}
table.rel{width:100%;border-collapse:collapse;font-size:.84rem}
table.rel th{text-align:left;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.1em;color:var(--fog);padding:6px;border-bottom:1px solid var(--rule)}
table.rel td{padding:6px;border-bottom:1px solid #1B2448}
table.rel td.n{font-family:var(--f-mono);text-align:center}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #1B2448}
.switch{width:46px;height:26px;border-radius:20px;border:0;background:#2A3358;position:relative}
.switch::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--fog);transition:left .2s}
.switch.on{background:var(--sodium)}
.switch.on::after{left:23px;background:#1B1200}

/* ---------- Examen final ---------- */
.exam{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);height:min(820px,100%)}
.docs{border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.doctabs{display:flex;gap:4px;padding:10px;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
.doctabs button{padding:5px 10px;border-radius:8px;border:1px solid var(--rule);background:none;color:var(--fog);font-family:var(--f-mono);font-size:.74rem}
.doctabs button.on{background:var(--sodium);color:#1B1200;border-color:var(--sodium)}
.doctabs button.rel{border-color:#5A4520;color:#FFD58C}
.docview{flex:1;overflow:auto;padding:16px}
.docview h4{font-family:var(--f-display);font-size:1.4rem;font-weight:800;margin-bottom:8px}
.docview .body{white-space:pre-line;font-size:.94rem}
.docview small{display:block;margin-top:10px;color:var(--fog)}
.qpane{display:flex;flex-direction:column;min-height:0}
.qnav{display:flex;gap:5px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--rule)}
.qnav button{width:32px;height:32px;border-radius:8px;border:1px solid var(--rule);background:none;color:var(--fog);font-family:var(--f-mono);font-size:.8rem}
.qnav button.ans{background:#1A2347;color:var(--paper)}
.qnav button.on{border-color:var(--sodium);color:var(--sodium)}
.qnav button.good{background:#0E2A22;border-color:var(--ok);color:var(--ok)}
.qnav button.bad{background:#2A0F18;border-color:var(--cartel);color:var(--cartel)}

/* ---------- Intro ---------- */
#intro{background:radial-gradient(80% 70% at 50% 30%,rgba(22,32,74,.55),rgba(5,7,15,.9))}
.intro{padding:34px 30px 28px}
.intro .logo{font-family:var(--f-display);font-weight:900;font-size:clamp(3rem,10vw,5.6rem);line-height:.82;text-transform:uppercase;letter-spacing:-.01em}
.intro .logo em{font-style:normal;color:var(--sodium);display:block;font-size:.5em;letter-spacing:.32em;margin-top:6px}
.intro p.story{color:#C9D0E6;max-width:60ch;margin:16px 0 22px;font-size:1rem}
.field{display:grid;gap:6px;margin-bottom:16px}
.field label{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--fog)}
.field input{padding:12px 14px;border-radius:12px;border:1px solid var(--rule);background:#0B1124;color:var(--paper);font:inherit;font-size:1.05rem}
.archs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.arch{padding:12px;border-radius:12px;border:1px solid var(--rule);background:var(--panel);text-align:left}
.arch .ico{width:26px;height:26px;color:var(--sodium)}
.arch b{display:block;margin-top:6px;font-family:var(--f-display);font-size:1.3rem}
.arch small{color:var(--fog);font-size:.76rem}
.arch.on{border-color:var(--sodium);background:#221D14}
.swatches{display:flex;gap:8px}
.swatches button{width:34px;height:34px;border-radius:50%;border:2px solid transparent}
.swatches button.on{border-color:var(--paper);box-shadow:0 0 0 3px rgba(255,255,255,.15)}

/* ---------- Juno, toasts, dialogues ---------- */
#juno{position:fixed;z-index:15;left:14px;bottom:84px;max-width:min(380px,calc(100% - 28px));display:none}
#juno.open{display:block;animation:rise .3s}
.bubble{display:flex;gap:12px;padding:12px 14px;border-color:#4A3A1A}
.bubble svg{width:44px;height:44px;flex:none}
.bubble b{font-family:var(--f-display);font-size:1.05rem}
.bubble p{font-size:.88rem;margin-top:2px}
.bubble .acts{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
#toasts{position:fixed;z-index:70;left:50%;bottom:70px;transform:translateX(-50%);display:grid;gap:6px;justify-items:center;pointer-events:none}
.toast{padding:9px 16px;border-radius:30px;background:rgba(17,25,52,.95);border:1px solid var(--rule);font-size:.88rem;font-weight:600;animation:toast 3.4s ease forwards;white-space:nowrap}
.toast.gold{border-color:var(--sodium);color:#FFD58C}
.toast.green{border-color:var(--ok);color:#9FF0C8}
@keyframes toast{0%{opacity:0;transform:translateY(10px)}8%,85%{opacity:1;transform:none}100%{opacity:0}}
.dlg{padding:24px}
.dlg h3{font-family:var(--f-display);font-weight:900;font-size:1.8rem;text-transform:uppercase;margin-bottom:8px}
.dlg p{color:#C9D0E6;margin-bottom:16px}
#dialog{z-index:40}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:65;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.cert{border:2px solid var(--sodium);border-radius:16px;padding:22px;margin:16px 0;background:linear-gradient(140deg,#221D14,#111934)}
.cert h4{font-family:var(--f-display);font-size:2rem;font-weight:900;text-transform:uppercase}

/* ---------- Mobile ---------- */
@media (max-width:760px){
  .hud-obj{top:auto;bottom:70px;max-width:calc(100% - 28px);font-size:.8rem}
  .hud-player{min-width:0;padding:6px 10px 6px 6px}
  .hud-player .nm{font-size:1.05rem}
  .city{min-width:110px;padding:6px 10px}
  .stat{padding:6px 10px}
  .hud-right{gap:6px}
  .hud-right .city .row span{display:none}
  .saved{top:64px}
  .hint-bar{display:none}
  .hud-phare{bottom:14px}
  .hud-phare small{display:none}
  .panel{top:auto;bottom:0;right:0;left:0;width:100%;max-height:68%;border-radius:18px 18px 0 0;transform:translateY(105%)}
  .panel.open{transform:none}
  .panel h2{font-size:2rem}
  .screen{padding:0}
  .sheet{border-radius:0;height:100%;max-height:100%;border:0}
  .sheet.narrow{height:auto;border-radius:18px;margin:12px}
  .mission{max-height:100%;height:100%}
  .hp{display:none}
  .match{grid-template-columns:1fr}
  .exam{grid-template-columns:1fr;grid-template-rows:42% 58%;height:100%}
  .docs{border-right:0;border-bottom:1px solid var(--rule)}
  .archs{grid-template-columns:1fr}
  .linewrap{padding:16px}
  #juno{bottom:120px}
}
@media (max-width:1100px) and (min-width:761px){.hud-obj{top:auto;bottom:16px}.hint-bar{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
body.reduced *{animation:none!important;transition:none!important}

<body>
<div id="stage" aria-label="Carte d’Agoria"><div id="world"></div></div>
<div id="hud"></div>
<aside id="panel" class="panel card" aria-live="polite"></aside>
<div id="line" class="screen"></div>
<div id="phare" class="screen"></div>
<div id="final" class="screen"></div>
<div id="modal" class="screen"></div>
<div id="intro" class="screen"></div>
<div id="dialog" class="screen"></div>
<div id="juno"></div>
<div id="toasts"></div>
<script>/* Ligne 1 · Port-Marché · Thème 1 — L’intégration de l’entreprise dans son environnement */
(window.CQ = window.CQ || { D: [] }).D.push({
  id: 'd1', n: 1, name: 'Port-Marché', color: '#3BA7FF', pos: [384, 752],

        {

        {

        {
          t: 'qcm', d: 'eco', title: 'Création monétaire',

          f: { 0: 'Idée très répandue, mais inexacte : la banque n’a pas besoin d’un dépôt préalable pour accorder un crédit.', 2: 'Les billets ne sont qu’une petite partie de la monnaie ; ici, tout se passe par une écriture sur un compte.' },
          h: 'Regarde ce qui apparaît sur le compte de la PME au moment du crédit.',
          e: 'En accordant un crédit, la banque **crée de la monnaie scripturale** : elle inscrit la somme sur le compte de l’emprunteur, sans la prélever sur le compte de quelqu’un d’autre. Cette monnaie sera **détruite** lors du remboursement. La création monétaire reste encadrée par la Banque centrale (taux directeurs) et par les règles prudentielles imposées aux banques.',

        {

        }
      ]
    },
    {

      ex: [
        {

/* ---------- caméra ---------- */
const stage = $('#stage'), world = $('#world');
const cam = { x: 0, y: 0, s: 1, min: 0.3, max: 3, fit: 1 };
function applyCam(anim) { world.style.transition = anim && !S.settings.reduced ? 'transform .7s cubic-bezier(.2,.8,.2,1)' : 'none'; world.style.transform = `translate3d(${cam.x}px,${cam.y}px,0) scale(${cam.s})`; }
function clampCam() { const W = innerWidth, H = innerHeight, w = VW * cam.s, h = VH * cam.s; cam.x = w <= W ? (W - w) / 2 : clamp(cam.x, W - w - 60, 60); cam.y = h <= H ? (H - h) / 2 : clamp(cam.y, H - h - 60, 60); }
function fitCam(anim) { const W = innerWidth, H = innerHeight; const s = Math.max(W / VW, Math.min(H / VH, W / VW * 2.2)); cam.fit = s; cam.min = s * 0.8; cam.max = s * 3.2; cam.s = s; cam.x = (W - VW * s) / 2; cam.y = (H - VH * s) / 2; clampCam(); applyCam(anim); }
function zoomAt(mx, my, ns, anim) { ns = clamp(ns, cam.min, cam.max); const wx = (mx - cam.x) / cam.s, wy = (my - cam.y) / cam.s; cam.s = ns; cam.x = mx - wx * ns; cam.y = my - wy * ns; clampCam(); applyCam(anim); }
function focus(px, py, k) { const W = innerWidth, H = innerHeight, mob = W <= 760; const cx = mob ? W / 2 : (W - 420) / 2, cy = mob ? H * 0.27 : H / 2 + 30; cam.s = clamp(cam.fit * (k || 1.7), cam.min, cam.max); cam.x = cx - px * cam.s; cam.y = cy - py * cam.s; clampCam(); applyCam(true); }
let drag = null, downHit = null;
stage.addEventListener('pointerdown', e => { if (e.button !== 0) return; downHit = e.target.closest('[data-hit]'); drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false }; });
addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (!drag.moved && Math.hypot(dx, dy) > 6) { drag.moved = true; stage.classList.add('drag'); } if (drag.moved) { cam.x = drag.cx + dx; cam.y = drag.cy + dy; clampCam(); applyCam(false); } });
addEventListener('pointerup', e => { if (!drag) return; const moved = drag.moved; drag = null; stage.classList.remove('drag'); if (!moved && downHit) hitAction(downHit.dataset.hit); else if (!moved && !downHit) closePanel(); downHit = null; });
stage.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, cam.s * Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
stage.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.hit) { e.preventDefault(); hitAction(e.target.dataset.hit); } });
addEventListener('resize', () => fitCam(false));
function hitAction(h) { sfx('tap'); if (h === 'tour') return openTour(); if (h === 'phare') return openPhare(); if (h.startsWith('d:')) openDistrict(D.find(d => d.id === h.slice(2))); }

  ${ob ? `<button class="card hud-obj" id="obj" type="button"><b>OBJECTIF</b><span>${T(ob.txt)}</span>${ico('right')}</button>` : ''}
  <div class="hud-right"><div class="card stat" title="Écus">${ico('coin')}<span>${nf(S.ecus)}</span></div><div class="card city"><div class="row"><span>AGORIA LIBÉRÉE</span><b>${fr(cityPct() + ' %')}</b></div><div class="bar"><i style="width:${cityPct()}%"></i></div></div></div>

function saveBadge() { const el = $('#saved'); if (!el) return; el.className = 'saved ' + (cloud.ok ? '' : 'local'); el.textContent = cloud.ok ? '● Sauvegardé sur ton compte' : localOK ? '● Sauvegardé dans ce navigateur' : '● Sauvegarde indisponible : exporte ta progression'; }

/* ---------- toasts, Juno, dialogues ---------- */
function toast(t, k) { const el = document.createElement('div'); el.className = 'toast ' + (k || ''); el.innerHTML = T(t); $('#toasts').appendChild(el); setTimeout(() => el.remove(), 3500); }
function floatTxt(t, x, y) { const el = document.createElement('div'); el.className = 'float'; el.textContent = t; el.style.left = (x || innerWidth / 2) + 'px'; el.style.top = (y || innerHeight / 2) + 'px'; document.body.appendChild(el); setTimeout(() => el.remove(), 1300); }
let junoQ = [], junoT = 0;
function juno(lines, onDone) { junoQ = lines.slice(); junoNext(onDone); }
function junoNext(onDone) {
  const el = $('#juno'); clearTimeout(junoT);
  if (!junoQ.length) { el.className = ''; onDone && onDone(); return; }
  const t = junoQ.shift();
  el.innerHTML = `<div class="card bubble">${JUNO()}<div><b>Juno</b><p>${M(t)}</p><div class="acts">${junoQ.length ? `<button class="btn small" id="jn" type="button">Suivant</button>` : `<button class="btn small ghost" id="jn" type="button">Compris</button>`}</div></div></div>`;
  el.className = 'open'; $('#jn').onclick = () => { sfx('tap'); junoNext(onDone); };
  if (!junoQ.length) junoT = setTimeout(() => { el.className = ''; }, 12000);
}
function guide(force) {
  const n = S.player ? S.player.name : '';
  juno([`Bienvenue à Agoria, **${n}** ! Je suis Juno, ta mentore. Le Cartel Vortex a plongé six quartiers dans l’ombre.`, 'Chaque quartier est une **ligne de métro** et correspond à un **thème du programme de CEJM**. Clique sur un quartier pour voir ses stations.', 'Chaque mission validée **rallume un immeuble**. Au terminus, bats le lieutenant du Cartel pour libérer le quartier.', 'Le **Phare**, en bas à gauche, c’est notre QG : le Codex des notions, les fiches méthode, ton relevé de résultats et les réglages.', 'Quand les six lieutenants seront tombés, la **Tour Vortex** s’ouvrira : un BTS blanc complet. À toi de jouer !'], () => { if (!force) { S.flags.guide = true; save(); } });
}
function dialog(title, text, ok, cancel, danger) {
  return new Promise(res => {
    const el = $('#dialog'); el.innerHTML = `<div class="sheet narrow dlg" role="dialog" aria-modal="true"><h3>${T(title)}</h3><p>${M(text)}</p><div class="row-end">${cancel ? `<button class="btn ghost" id="dno" type="button">${T(cancel)}</button>` : ''}<button class="btn ${danger ? 'danger' : ''}" id="dok" type="button">${T(ok)}</button></div></div>`;
    el.classList.add('open'); const close = v => { el.classList.remove('open'); el.innerHTML = ''; res(v); };
    $('#dok').onclick = () => close(true); if (cancel) $('#dno').onclick = () => close(false); $('#dok').focus();

}
function confetti() { if (S.settings.reduced) return; const c = document.createElement('div'); c.className = 'confetti'; let h = ''; for (let i = 0; i < 70; i++) h += `<i style="left:${Math.random() * 100}%;background:${COLORS[i % 6]};animation-duration:${1.6 + Math.random() * 1.8}s;animation-delay:${Math.random() * 0.5}s"></i>`; c.innerHTML = h; document.body.appendChild(c); setTimeout(() => c.remove(), 4200); }

const stars = n => [0, 1, 2].map(i => i < n ? '★' : '<span class="off">★</span>').join('');

/* ---------- ligne de métro ---------- */
let LINE = null;
function openLine(d) {
  LINE = d; closePanel();
  const items = d.missions.map(m => ({ m })).concat([{ boss: true }]);
  const n = items.length, vert = innerWidth < innerHeight;
  const W = vert ? 420 : 1100, H = vert ? 1000 : 440;
  const pts = items.map((_, i) => vert ? [i % 2 ? 250 : 130, 70 + i * ((H - 140) / (n - 1))] : [80 + i * ((W - 200) / (n - 1)), i % 2 ? 150 : 270]);
  let path = `M${pts[0][0]} ${pts[0][1]}`; for (let i = 1; i < n; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; path += vert ? ` C${x0} ${(y0 + y1) / 2} ${x1} ${(y0 + y1) / 2} ${x1} ${y1}` : ` C${(x0 + x1) / 2} ${y0} ${(x0 + x1) / 2} ${y1} ${x1} ${y1}`; }
  const curIdx = items.findIndex(it => it.boss ? !bWon(d) : !mDone(it.m));
  const st = items.map((it, i) => {
    const [x, y] = pts[i], boss = !!it.boss;
    const done = boss ? bWon(d) : mDone(it.m), open = boss ? bossUnlocked(d) : mUnlocked(it.m), r = boss ? 30 : 22;
    const lab1 = boss ? 'TERMINUS' : 'STATION ' + (i + 1), lab2 = boss ? d.boss.name : it.m.title;
    const ly = vert ? y + 6 : (i % 2 ? y - r - 34 : y + r + 30), lx = vert ? (i % 2 ? x - r - 14 : x + r + 14) : x, anchor = vert ? (i % 2 ? 'end' : 'start') : 'middle';
    const s = !boss && S.missions[it.m.id] ? S.missions[it.m.id].stars : 0;
    const inner = done ? (boss ? `<path d="M${x - 9} ${y}l6 6 12-13" fill="none" stroke="#071022" stroke-width="4" stroke-linecap="round"/>` : `<text x="${x}" y="${y + 7}" text-anchor="middle" font-family="Big Shoulders, Arial Narrow" font-weight="900" font-size="20" fill="#071022">${i + 1}</text>`) : open ? `<text x="${x}" y="${y + 7}" text-anchor="middle" font-family="Big Shoulders, Arial Narrow" font-weight="900" font-size="${boss ? 22 : 20}" fill="${d.color}">${boss ? '!' : i + 1}</text>` : `<g transform="translate(${x - 10} ${y - 10}) scale(.85)" fill="none" stroke="#5B6690" stroke-width="2">${IC.lock}</g>`;
    const wrap = t => { const words = t.split(' '); const lines = ['']; words.forEach(w => { if ((lines[lines.length - 1] + ' ' + w).trim().length > 22) lines.push(w); else lines[lines.length - 1] = (lines[lines.length - 1] + ' ' + w).trim(); }); return lines; };
    const l2 = wrap(lab2).map((t, k) => `<tspan x="${lx}" dy="${k ? 24 : 0}">${esc(t)}</tspan>`).join('');
    return `<g class="st ${open ? '' : 'lock'} ${i === curIdx ? 'cur' : ''}" data-st="${i}" tabindex="0" role="button" aria-label="${esc(lab1 + ' : ' + lab2)}"><circle class="ring" cx="${x}" cy="${y}" r="${r}" fill="${done ? d.color : '#0B1124'}" stroke="${open ? d.color : '#2C3768'}" stroke-width="5"/>${inner}<text class="t1" x="${lx}" y="${vert ? ly - 18 : ly - 22}" text-anchor="${anchor}">${lab1}${s ? ' · ' + '★'.repeat(s) : ''}</text><text class="t2" x="${lx}" y="${ly}" text-anchor="${anchor}">${l2}</text></g>`;
  }).join('');
  const p = dProg(d);
  openScreen('line', `<div class="linewrap" style="--k:${d.color}"><div class="linehead"><div><div class="linebadge"><i>${d.n}</i>LIGNE ${d.n} · ${T(d.theme).toUpperCase()} · ${p.done} / ${p.total} STATIONS</div><h2>${T(d.name)}</h2><p>${T(d.themeTitle)}. Valide les stations dans l’ordre ; le lieutenant du Cartel attend au terminus.</p></div><button class="btn ghost" id="lback" type="button">${ico('left')} Retour à la ville</button></div>
  <div class="linesvg"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><path d="${path}" fill="none" stroke="#0A0F22" stroke-width="22" stroke-linecap="round"/><path d="${path}" fill="none" stroke="${d.color}" stroke-width="9" stroke-linecap="round" opacity=".9"/>${st}</svg></div><div class="linefoot">Clique sur une station pour lire son briefing · Échap pour revenir à la ville</div></div>`);
  $('#lback').onclick = () => { closeScreen('line'); openDistrict(d); };
  $$('#line .st').forEach(g => { const act = () => { const it = items[+g.dataset.st]; if (g.classList.contains('lock')) { sfx('ko'); toast(it.boss ? 'Termine toutes les missions de la ligne pour affronter le lieutenant.' : 'Valide d’abord la station précédente.'); return; } sfx('tap'); it.boss ? briefBoss(d) : briefMission(it.m); }; g.onclick = act; g.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } }; });
}

  <p style="margin-bottom:10px">${T(d.bossFight.intro)}</p><ul class="exlist"><li>${ico('bolt')}${n} questions sur tout le thème ${d.n}</li><li>${ico('shield')}3 boucliers : chaque erreur en coûte un, et la question revient plus tard</li><li>${ico('trophy')}Victoire : le quartier est libéré (+150 XP, +80 écus)</li></ul>

/* ---------- composants d’exercice ---------- */
function makeEx(ex, host, exam) {
  const api = { ready: () => false, check: () => ({ ok: false }), reveal() { }, lock() { host.classList.add('locked'); api.locked = true; }, value: () => null, set() { }, key: null, onchange: null, wrong() { } };
  const changed = () => api.onchange && api.onchange();
  const head = (ex.doc ? `<div class="doc"><b>${T(ex.doc.title)}</b>${M(ex.doc.body)}</div>` : '') + `<p class="q">${M(ex.q)}</p>`;
  const t = ex.t;
  if (t === 'qcm' || t === 'multi') {
    const multi = t === 'multi', order = shuffle(ex.o.map((_, i) => i)), sel = new Set();
    host.innerHTML = head + `<div class="opts ${multi ? 'multi' : ''}">${order.map((oi, k) => `<button class="opt" data-i="${oi}" type="button"><span class="key">${multi ? '✓' : 'ABCDEFGH'[k]}</span><span>${M(ex.o[oi])}</span></button>`).join('')}</div>`;
    const btns = $$('.opt', host);
    const paint = () => btns.forEach(b => { const i = +b.dataset.i; b.classList.toggle('sel', sel.has(i)); b.querySelector('.key').textContent = multi ? (sel.has(i) ? '✓' : '') : 'ABCDEFGH'[btns.indexOf(b)]; });
    btns.forEach(b => b.onclick = () => { if (api.locked) return; const i = +b.dataset.i; btns.forEach(x => x.classList.remove('ko', 'ok', 'miss')); if (multi) sel.has(i) ? sel.delete(i) : sel.add(i); else { sel.clear(); sel.add(i); } paint(); sfx('tap'); changed(); });
    paint();
    const good = multi ? new Set(ex.a) : new Set([ex.a]);
    api.ready = () => sel.size > 0;
    api.check = () => { const ok = sel.size === good.size && [...sel].every(i => good.has(i)); let msg = ''; if (!ok) { if (!multi) msg = (ex.f && ex.f[[...sel][0]]) || ''; else { const miss = [...good].some(i => !sel.has(i)), extra = [...sel].some(i => !good.has(i)); msg = extra ? 'Au moins une réponse cochée est fausse.' : miss ? 'Il manque au moins une bonne réponse.' : ''; } } return { ok, msg }; };
    api.wrong = () => { if (!multi) { btns.forEach(b => { if (sel.has(+b.dataset.i)) b.classList.add('ko'); }); sel.clear(); paint(); } };
    api.reveal = () => btns.forEach(b => { const i = +b.dataset.i; b.classList.toggle('ok', good.has(i)); b.classList.toggle('ko', sel.has(i) && !good.has(i)); b.classList.toggle('miss', good.has(i) && !sel.has(i) && multi); });

  } else if (tab === 'releve') {
    const rows = Object.keys(S.ex).map(id => [id, EX[id], S.ex[id]]).filter(r => r[1]);
    tb.innerHTML = rows.length ? `<p class="kbd" style="margin-bottom:8px">Chaque exercice : réussites, erreurs, aides (indices et corrections consultées).</p><div style="overflow-x:auto"><table class="rel"><thead><tr><th>Exercice</th><th>Ligne</th><th>OK</th><th>Erreurs</th><th>Aides</th><th>1er coup</th></tr></thead><tbody>${rows.map(([id, e, r]) => { const dn = id.startsWith('meth') ? 'Phare' : 'L' + id.charAt(1); return `<tr><td>${T(e.title)}</td><td class="n">${dn}</td><td class="n">${r.ok}</td><td class="n ${r.ko ? 'bad' : ''}">${r.ko}</td><td class="n ${r.aide ? 'meh' : ''}">${r.aide}</td><td class="n">${r.first ? '<span class="good">✓</span>' : '–'}</td></tr>`; }).join('')}</tbody></table></div>` : '<p class="kbd">Aucun exercice pour l’instant. Ton relevé se remplira au fil des missions.</p>';
  } else if (tab === 'reglages') {
    tb.innerHTML = `<div class="set"><div><b>Son</b><p class="kbd">Effets sonores du jeu</p></div><button class="switch ${S.settings.sound ? 'on' : ''}" id="ss" type="button" aria-label="Son"></button></div><div class="set"><div><b>Animations réduites</b><p class="kbd">Supprime les animations et les transitions</p></div><button class="switch ${S.settings.reduced ? 'on' : ''}" id="sr" type="button" aria-label="Animations réduites"></button></div>
    <div class="set"><div><b>Pseudo</b></div><div style="display:flex;gap:6px"><input class="search" id="sn" style="width:180px" maxlength="20" value="${esc(S.player.name)}" aria-label="Pseudo"><button class="btn small" id="snok" type="button">OK</button></div></div>
    <div class="set" style="display:block"><b>Sauvegarde</b><p class="kbd" style="margin:4px 0 10px">${cloud.ok ? 'Ta progression est enregistrée sur ton compte et dans ce navigateur.' : 'Ta progression est enregistrée dans ce navigateur. Pour la transférer sur un autre appareil, copie ce code puis colle-le là-bas.'}</p><textarea id="exp" style="min-height:70px;font-family:var(--f-mono);font-size:.72rem" aria-label="Code de sauvegarde"></textarea><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn small" id="cpy" type="button">${ico('copy')} Copier mon code</button><button class="btn small ghost" id="imp" type="button">Importer le code collé</button><button class="btn small danger" id="rst" type="button" style="margin-left:auto">Tout recommencer</button></div></div>`;
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); $('#exp').value = code;
    $('#ss').onclick = () => { S.settings.sound = !S.settings.sound; save(); openPhare('reglages'); renderHUD(); };
    $('#sr').onclick = () => { S.settings.reduced = !S.settings.reduced; document.body.classList.toggle('reduced', S.settings.reduced); save(); openPhare('reglages'); };
    $('#snok').onclick = () => { const v = $('#sn').value.trim().slice(0, 20); if (v) { S.player.name = v; save(); renderHUD(); toast('Pseudo modifié', 'green'); } };
    $('#cpy').onclick = async () => { try { await navigator.clipboard.writeText(code); toast('Code copié', 'green'); } catch (e) { $('#exp').select(); toast('Sélectionne le code et copie-le (Ctrl+C).'); } };
    $('#imp').onclick = async () => { let d = null; try { d = JSON.parse(decodeURIComponent(escape(atob($('#exp').value.trim())))); } catch (e) { } if (!d || d.v !== 1) { toast('Code invalide : colle un code copié depuis CEJM Quest.'); return; } if (await dialog('Importer ?', 'Ta progression actuelle sera remplacée par celle du code.', 'Importer', 'Annuler')) { adopt(d); save(); refreshAll(); openPhare('profil'); toast('Progression importée', 'green'); } };
    $('#rst').onclick = async () => { if (await dialog('Tout recommencer ?', 'Toute ta progression (XP, missions, badges) sera effacée. Pense à copier ton code avant.', 'Effacer', 'Annuler', true)) { const st = S.settings; S = fresh(); S.settings = st; save(); closeScreen('phare'); refreshAll(); intro(); } };
  }
}

/* ---------- intro ---------- */
function intro() {
  let arch = 'eco', color = COLORS[0];
  openScreen('intro', `<div class="sheet intro" style="width:min(720px,100%)"><div class="eyebrow">BTS NDRC · Culture économique, juridique et managériale</div><div class="logo" style="margin-top:10px">CEJM Quest<em>Agoria</em></div><p class="story">Agoria, la métropole des échanges, a sombré. Le Cartel Vortex a plongé ses six quartiers dans l’ombre : marchés truqués, contrats falsifiés, données volées, salariés exploités. Tes armes : l’économie, le droit et le management. Reprends la ville, ligne après ligne, jusqu’au BTS blanc final.</p>
  <div class="field"><label for="pn">Ton pseudo</label><input id="pn" maxlength="20" autocomplete="off" placeholder="Ex. : Badas"></div>
  <div class="field"><label>Ton profil</label><div class="archs">${Object.entries(ARCH).map(([k, a]) => `<button class="arch ${k === arch ? 'on' : ''}" data-a="${k}" type="button">${ico(a[1])}<b>${a[0]}</b><small>${T(a[2])}</small></button>`).join('')}</div></div>
  <div class="field"><label>Ta couleur</label><div class="swatches">${COLORS.map(c => `<button data-c="${c}" class="${c === color ? 'on' : ''}" style="background:${c}" type="button" aria-label="Couleur ${c}"></button>`).join('')}</div></div>
  <div class="row-end"><button class="btn" id="go0" type="button" disabled>Entrer dans Agoria ${ico('right')}</button></div></div>`);
  const pn = $('#pn'), go = $('#go0'); pn.oninput = () => go.disabled = !pn.value.trim(); setTimeout(() => pn.focus(), 80);
  $$('[data-a]').forEach(b => b.onclick = () => { arch = b.dataset.a; $$('[data-a]').forEach(x => x.classList.toggle('on', x === b)); });
  $$('[data-c]').forEach(b => b.onclick = () => { color = b.dataset.c; $$('[data-c]').forEach(x => x.classList.toggle('on', x === b)); });
  pn.onkeydown = e => { if (e.key === 'Enter' && pn.value.trim()) go.click(); };
  go.onclick = () => { S.player = { name: pn.value.trim().slice(0, 20), arch, color }; save(); sfx('win'); closeScreen('intro'); renderHUD(); updateMap(false); fitCam(true); setTimeout(() => guide(false), 600); };
}

/* ---------- démarrage ---------- */
function start(data) {
  loadLocal(); if (data && data.S && data.S.v === 1 && (data.S.t || 0) >= (S.t || 0)) adopt(data.S);
  document.body.classList.toggle('reduced', !!S.settings.reduced);
  buildMap(); fitCam(false); updateMap(false); renderHUD();
  if (!S.player) intro(); else if (!S.flags.guide) guide(false);
  cloudInit();
  try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ S })); } catch (e) { }
  if (window.__CQ_DEBUG) window.__cq = { S: () => S, D, EX, FQ, METH, playMission, playBoss, playFinal, openDistrict, openLine, openPhare, setS: v => { adopt(v); refreshAll(); } };
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
